title: AntiEstafa - Mensaje sospechoso reportado por un empleado
id: 27ac6da8-c75f-4588-a8f5-8c4a1f947192
status: experimental
description: >
  Un empleado revisó en AntiEstafa AR algo que dio SOSPECHOSO. Conviene revisarlo y, si se repite,
  avisar al resto de la organización.
references:
  - https://attack.mitre.org/techniques/T1566/
author: Manuel A., María Sofía Genta (AntiEstafa AR · tecnoros.ar)
date: 2026-10-25
tags:
  - attack.initial-access
  - attack.t1566
logsource:
  product: antiestafa
  service: analisis
detection:
  selection:
    event.module: antiestafa
    event.outcome: sospechoso
  condition: selection
fields:
  - organization.id
  - antiestafa.canal
  - antiestafa.score
  - antiestafa.dominios
falsepositives:
  - Mensajes comerciales legítimos con apuro o links acortados.
level: medium
